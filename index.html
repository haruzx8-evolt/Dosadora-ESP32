<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dosadora Granular — Painel de Controle</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="stylesheet" href="styles.css">
<style>
  .config { display: flex; gap: 8px; margin-bottom: 24px; }

  .config input {
    flex: 1;
    background: #000;
    border: 1px solid var(--painel-borda);
    color: var(--texto);
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 0.9rem;
  }

  .config button, .acoes button, .dosagem button {
    background: var(--roxo);
    color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .config button:hover, .acoes button:hover, .dosagem button:hover { background: var(--roxo-claro); }

  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    background: var(--alerta);
  }
  .status-dot.conectado { background: var(--ok); }

  .peso { text-align: center; padding: 12px 0 20px; }

  .peso .valor {
    font-family: "Rajdhani", sans-serif;
    font-size: 3.6rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--roxo-claro);
    line-height: 1;
  }

  .peso .unidade { font-size: 1.1rem; color: var(--texto-fraco); margin-left: 4px; }
  .peso .rotulo { color: var(--texto-fraco); font-size: 0.85rem; margin-top: 6px; }

  .linha-status {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--texto-fraco);
    padding-top: 12px;
    border-top: 1px solid var(--painel-borda);
  }

  .acoes { display: flex; gap: 10px; margin-bottom: 20px; }

  .acoes button {
    flex: 1;
    background: transparent;
    border: 1px solid var(--painel-borda);
    color: var(--texto);
  }

  .acoes button.ligado { background: var(--roxo); border-color: var(--roxo); }

  .dosagem { display: flex; gap: 10px; }

  .dosagem input {
    flex: 1;
    background: #000;
    border: 1px solid var(--painel-borda);
    color: var(--texto);
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 0.95rem;
    font-variant-numeric: tabular-nums;
  }

  .dosagem button.parar { background: var(--alerta); }

  .servo-controle { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--painel-borda); }
  .servo-controle label { display: block; font-size: 0.85rem; color: var(--texto-fraco); margin-bottom: 8px; }
  .servo-controle input[type="range"] { width: 100%; accent-color: var(--roxo); }

  .titulo-pagina { margin-bottom: 24px; }
  .titulo-pagina h1 { font-size: 1.8rem; margin: 0 0 4px; }
  .titulo-pagina p { margin: 0; color: var(--texto-fraco); }
</style>
</head>
<body>
  <header class="navbar">
    <div class="marca">Hex<span>Tech</span></div>
    <nav>
      <a href="index.html" class="ativo">Painel</a>
      <a href="sobre.html">Sobre</a>
      <a href="historico.html">Histórico</a>
    </nav>
  </header>

  <main class="conteudo">
    <div class="titulo-pagina">
      <h1>Painel de Controle</h1>
      <p><span id="statusDot" class="status-dot"></span><span id="statusTexto">desconectado</span></p>
    </div>

    <div class="config">
      <input id="ipEsp32" type="text" placeholder="IP do ESP32, ex: 192.168.1.42" value="192.168.1.42">
      <button id="btnConectar">Conectar</button>
    </div>

    <section class="painel">
      <div class="peso">
        <span class="valor" id="pesoValor">--</span><span class="unidade">g</span>
        <div class="rotulo">peso na célula de carga</div>
      </div>
      <div class="linha-status">
        <span id="estadoDosagem">parado</span>
        <span id="metaAtual">meta: --</span>
      </div>
    </section>

    <section class="acoes">
      <button id="btnBomba">Bomba/Rosca</button>
    </section>

    <section class="painel dosagem-secao">
      <div class="dosagem">
        <input id="metaInput" type="number" placeholder="quantidade em gramas" min="0">
        <button id="btnDosar">Iniciar dosagem</button>
        <button id="btnParar" class="parar">Parar</button>
      </div>

      <div class="servo-controle">
        <label for="servoRange">Posição manual do servo (abertura do dosador)</label>
        <input id="servoRange" type="range" min="0" max="180" value="0">
      </div>
    </section>
  </main>

  <footer class="rodape">Projeto Dosadora Granular — HexTech</footer>

<script src="historico.js"></script>
<script>
  let baseUrl = "";
  let intervaloStatus = null;
  let estadoAnterior = false;

  const els = {
    ip: document.getElementById("ipEsp32"),
    btnConectar: document.getElementById("btnConectar"),
    statusDot: document.getElementById("statusDot"),
    statusTexto: document.getElementById("statusTexto"),
    peso: document.getElementById("pesoValor"),
    estadoDosagem: document.getElementById("estadoDosagem"),
    metaAtual: document.getElementById("metaAtual"),
    btnBomba: document.getElementById("btnBomba"),
    metaInput: document.getElementById("metaInput"),
    btnDosar: document.getElementById("btnDosar"),
    btnParar: document.getElementById("btnParar"),
    servoRange: document.getElementById("servoRange"),
  };

  async function chamarApi(caminho, opcoes = {}) {
    const resposta = await fetch(baseUrl + caminho, {
      headers: { "Content-Type": "application/json" },
      ...opcoes,
    });
    if (!resposta.ok) throw new Error("Falha na requisição: " + caminho);
    return resposta.json();
  }

  function marcarConectado(ok) {
    els.statusDot.classList.toggle("conectado", ok);
    els.statusTexto.textContent = ok ? "conectado" : "desconectado";
  }

  async function atualizarStatus() {
    try {
      const dados = await chamarApi("/api/status");
      els.peso.textContent = dados.peso.toFixed(1);
      els.estadoDosagem.textContent = dados.dosando ? "dosando..." : "parado";
      els.metaAtual.textContent = "meta: " + (dados.meta || "--") + " g";
      els.btnBomba.classList.toggle("ligado", dados.bomba);
      marcarConectado(true);

      // registra no histórico quando uma dosagem termina
      if (estadoAnterior && !dados.dosando) {
        registrarDosagem(dados.meta, dados.peso);
      }
      estadoAnterior = dados.dosando;
    } catch (erro) {
      marcarConectado(false);
    }
  }

  els.btnConectar.addEventListener("click", () => {
    baseUrl = "http://" + els.ip.value.trim();
    clearInterval(intervaloStatus);
    atualizarStatus();
    intervaloStatus = setInterval(atualizarStatus, 1000);
  });

  els.btnBomba.addEventListener("click", async () => {
    const ligado = els.btnBomba.classList.contains("ligado");
    await chamarApi("/api/bomba", { method: "POST", body: JSON.stringify({ estado: !ligado }) });
    atualizarStatus();
  });

  els.btnDosar.addEventListener("click", async () => {
    const meta = parseFloat(els.metaInput.value);
    if (!meta || meta <= 0) return;
    await chamarApi("/api/dosar", { method: "POST", body: JSON.stringify({ meta }) });
    atualizarStatus();
  });

  els.btnParar.addEventListener("click", async () => {
    await chamarApi("/api/parar", { method: "POST" });
    atualizarStatus();
  });

  els.servoRange.addEventListener("change", async () => {
    await chamarApi("/api/servo", { method: "POST", body: JSON.stringify({ posicao: parseInt(els.servoRange.value, 10) }) });
  });
</script>
</body>
</html>
